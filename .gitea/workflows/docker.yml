name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: gitea.big.netlobo.com
  IMAGE_NAME: netlobo/filesystem-gateway

jobs:
  build-and-push:
    runs-on: host
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 "${{ github.server_url }}/${{ github.repository }}.git" workspace
          cd workspace
          git fetch --tags --force
          git checkout "${{ github.sha }}"

      - name: Log in to Gitea Container Registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Determine version and tags
        id: meta
        run: |
          cd workspace
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            MAJOR_MINOR=$(echo "$VERSION" | sed -E 's/^(v[0-9]+\.[0-9]+).*/\1/')
            TAGS="${FULL_IMAGE}:${VERSION},${FULL_IMAGE}:${MAJOR_MINOR},${FULL_IMAGE}:latest,${FULL_IMAGE}:${SHA_SHORT}"
          else
            VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
            TAGS="${FULL_IMAGE}:latest,${FULL_IMAGE}:${SHA_SHORT}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          cd workspace
          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.meta.outputs.tags }}"
          TAG_FLAGS=""
          for tag in "${TAG_ARRAY[@]}"; do
            TAG_FLAGS="${TAG_FLAGS} -t ${tag}"
          done
          docker build ${TAG_FLAGS} --build-arg VERSION="${{ steps.meta.outputs.version }}" .
          for tag in "${TAG_ARRAY[@]}"; do
            docker push "${tag}"
          done

      - name: Cleanup
        if: always()
        run: rm -rf workspace
